<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çka po hajmë sot?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        url('https://images.pexels.com/photos/37065021/pexels-photo-37065021.jpeg?auto=compress&cs=tinysrgb&w=1600')
        center center / cover no-repeat;
      filter: brightness(0.45) saturate(1.05);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
    }

    .company {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.05;
      text-shadow: 0 2px 24px rgba(0,0,0,0.4);
    }
    .company em {
      font-style: italic;
      font-weight: 700;
    }

    .email {
      margin-top: 1.25rem;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      font-weight: 300;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .email:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <main class="page">
    <h1 class="company">Çka po hajmë <em>sot?</em></h1>
    <a class="email" href="mailto:valon@ckapohajmesot.com">valon@ckapohajmesot.com</a>
  </main>

</body>
</html>
